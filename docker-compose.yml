services:
  mysql:
    image: mysql:8
    container_name: ${PROJECT_NAME:-official}-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-official}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:${MYSQL_PORT:-3306}"
    volumes:
      - ./volumes/mysql_data:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d
      - ./db:/docker-entrypoint-initdb.d:ro
    restart: always
    networks:
      - official-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-official}-redis
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - ./volumes/redis_data:/data
    restart: always
    networks:
      - official-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ${PROJECT_NAME:-official}-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    restart: always
    networks:
      - official-network

  official:
    image: ${DOCKERHUB_USERNAME:-boyuanclub}/official-core-api:latest  # 使用Docker Hub镜像
    container_name: ${PROJECT_NAME:-official}-app
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./volumes/uploads:/official/uploads
      - ./volumes/logs:/official/logs
    environment:
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_NAME=${DB_NAME:-official}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - MAIL_HOST=${MAIL_HOST:-smtp.feishu.cn}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_USERNAME=${MAIL_USERNAME:-notify@boyuan.club}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - COS_SECRET_ID=${COS_SECRET_ID}
      - COS_SECRET_KEY=${COS_SECRET_KEY}
      - COS_REGION=${COS_REGION:-ap-shanghai}
      - COS_BUCKET=${COS_BUCKET}
      - COS_PUBLIC_BASE_URL=${COS_PUBLIC_BASE_URL:-}
      - COS_AVATAR_PREFIX=${COS_AVATAR_PREFIX:-avatars/}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SERVER_PORT=8080
      # 协同服务调用 /api/internal/** 的服务令牌；未配置时后端一律拒绝这些内部接口
      - COLLAB_SERVICE_TOKEN=${COLLAB_SERVICE_TOKEN}
      # 添加中文环境支持
      - LANG=zh_CN.UTF-8
      - LANGUAGE=zh_CN:zh
      - LC_ALL=zh_CN.UTF-8
      # 添加JVM参数以支持UTF-8编码和字体处理
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Djava.awt.headless=true -Djava.awt.fontconfig=/etc/fonts/fonts.conf -Dsun.java2d.fontpath=/usr/share/fonts
    # 移除了command行，因为已经在Dockerfile中定义了ENTRYPOINT
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - official-network

  # 面试评价表的实时协同服务（Yjs / Hocuspocus）。
  #
  # 必须固定单实例：文档以 Y.Doc 形式存在内存里，若在 A/B 两节点各跑一份，
  # 两边持有互不同步的副本，面试官会看不见彼此的编辑。因此只在 Node A 起这个服务，
  # nginx 的 /collab/ 也只指向本机 3100。要横向扩容需先接 Hocuspocus 的 Redis 扩展。
  #
  # 端口只绑 127.0.0.1：外部流量一律经 nginx 进来，容器端口不直接暴露公网。
  official-collab:
    image: ${DOCKERHUB_USERNAME:-boyuanclub}/official-collab-server:latest
    container_name: ${PROJECT_NAME:-official}-collab
    ports:
      - "127.0.0.1:${COLLAB_PORT:-3100}:3100"
    environment:
      - COLLAB_PORT=3100
      # 与后端同一把密钥，用于校验浏览器带来的 JWT
      - JWT_SECRET=${JWT_SECRET}
      - COLLAB_SERVICE_TOKEN=${COLLAB_SERVICE_TOKEN}
      - BACKEND_BASE_URL=http://official:8080
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_NAME=${DB_NAME:-official}
      - DB_POOL_SIZE=5
      - STORE_DEBOUNCE_MS=2000
      - MATERIALIZE_DEBOUNCE_MS=30000
      - RECONCILE_INTERVAL_MS=300000
      - TZ=Asia/Shanghai
    depends_on:
      - mysql
      - official
    restart: always
    networks:
      - official-network

networks:
  official-network:
    driver: bridge
