openapi: 3.0.1
info:
  title: 默认模块
  description: |
    博远信息技术社官网后端面试模块的完整 API 接口文档。

    **面试预约（与简历解耦）**：学生按 `InterviewSlot` 选择大时段（`interviewDate` + 24 小时制 `startTime`/`endTime`）；已约/共计用 `currentOccupied`/`maxCapacity`，约满时 `fullyBooked=true`。预约写入 `InterviewSchedule`；成功占坑后按 `(endTime - startTime) / maxCapacity` 均分并写入精确 `interviewTime`。默认开启秒杀模式（Lua 预扣 + Outbox/MQ 异步落库 + 消费端 Redis 幂等与失败回滚），推荐 `GET /api/interview/booking/requests/{requestId}/stream`（SSE）获取结果，轮询 `GET .../requests/{requestId}` 作兜底。`location` 可为 null。

    **飞书多维表格双向同步（异步）**：
    - **平台 → 飞书（PUSH）**：`POST /api/interview/feishu/import`，将 `interview_schedule`（`sync_status=0`）及关联简历字段写入飞书；按 `interview_slot.location` 分桶，并行写入各 `feishu_table_url`。
    - **飞书 → 平台（PULL）**：`POST /api/interview/feishu/import-from-table`，从飞书表格拉回录取结果，写入 `interview_result`，可选更新 `user.dept_id`。
    - 两类任务均立即返回 `taskId`（状态存 Redis，RabbitMQ 异步执行）；推荐 `GET /api/interview/feishu/import/tasks/{taskId}/stream`（SSE）订阅进度，轮询 `GET .../tasks/{taskId}` 作兜底。终态：`SUCCESS` / `PARTIAL_SUCCESS` / `FAILED`。
  version: 1.0.0
tags:
  - name: 登录注册页
  - name: 个人信息页
  - name: 简历相关功能——管理员
  - name: 管理员特殊功能
  - name: 简历相关功能——普通用户
  - name: 招聘活动相关接口（管理员专属）
  - name: 角色控制模块
  - name: 部门模块
  - name: 权限模块
  - name: 角色权限管理模块
  - name: 用户角色管理模块
  - name: 面试时间地点管理
  - name: 面试预约（学生）
  - name: 面试预约管理
  - name: 面试分配模块
  - name: 面试关联飞书模块
  - name: 面试结果模块
  - name: 面试结果统计页
  - name: 社团活动模块
  - name: interview-slot
  - name: interview-booking
  - name: interview-schedule
  - name: feishu-integration
  - name: interview-result
  - name: interview-statistics
paths:
  /api/auth/register:
    post:
      summary: 社团官网-注册
      deprecated: false
      description: ''
      tags:
        - 登录注册页
      parameters:
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                emailCode:
                  type: string
              required:
                - username
                - password
                - confirmPassword
                - name
                - email
                - phone
                - emailCode
            example:
              username: Student100
              password: PASSWORD666!
              confirmPassword: PASSWORD666!
              name: 张三
              email: 10245101417@stu.ecnu.edu.cn
              phone: '13136397218'
              emailCode: '762120'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      userId:
                        type: integer
                      username:
                        type: string
                    required:
                      - userId
                      - username
                required:
                  - code
                  - message
                  - data
          headers: {}
      security: []
  /api/auth/login:
    post:
      summary: 社团官网-登录
      deprecated: false
      description: ''
      tags:
        - 登录注册页
      parameters:
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auth_id:
                  type: string
                  description: 认证ID（email/phone/username，取决于 auth_type）
                auth_type:
                  type: string
                  description: 认证类型
                  example: username-password
                verify:
                  type: string
                  description: 验证信息（密码或验证码）
              required:
                - auth_id
                - auth_type
                - verify
            example:
              auth_id: admin
              auth_type: username-password
              verify: PASS123!
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                      token:
                        type: string
                      roleNames:
                        type: array
                        items:
                          type: string
                    required:
                      - user_id
                      - token
                      - roleNames
                required:
                  - code
                  - message
                  - data
          headers: {}
      security: []
  /api/auth/reset-password:
    post:
      summary: 重置密码
      deprecated: false
      description: ''
      tags:
        - 登录注册页
      parameters:
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: 邮箱或手机号
                code:
                  type: string
                  description: 验证码（6位数字）
                  example: '123456'
                newPassword:
                  type: string
                  description: 新密码
              required:
                - identifier
                - code
                - newPassword
            example:
              identifier: 10245101417@stu.ecnu.edu.cn
              code: 156521
              newPassword: h23121321005
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 操作成功
                  data:
                    nullable: true
                    example: null
                required:
                  - code
                  - message
                  - data
          headers: {}
      security: []
  /api/auth/send-email-code:
    post:
      summary: 发送邮箱验证码
      deprecated: false
      description: |
        生成验证码写入 Redis 后投递 RabbitMQ 异步发信，HTTP 立即返回。限流：同一 IP 60 秒内最多 5 次（超限 HTTP 429，业务码 4291）。
        邮箱须为 `@stu.ecnu.edu.cn` 后缀。
      tags:
        - 登录注册页
      parameters:
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 10245101417@stu.ecnu.edu.cn
              required:
                - email
            example:
              email: 10245101417@stu.ecnu.edu.cn
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: 'null'
                required:
                  - code
                  - message
                  - data
          headers: {}
      security: []
  /api/auth/send-sms-code:
    post:
      summary: 发送手机验证码
      deprecated: false
      description: ''
      tags:
        - 登录注册页
      parameters:
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 手机号
                  example: '13136397218'
              required:
                - phone
            example:
              phone: '13136397218'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: 'null'
                required:
                  - code
                  - message
                  - data
          headers: {}
      security: []
  /api/auth/logout:
    post:
      summary: 登出（弃用）
      deprecated: false
      description: ''
      tags:
        - 登录注册页
      parameters:
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: 'null'
                required:
                  - code
                  - message
                  - data
          headers: {}
      security:
        - bearer: []
  /api/user/me:
    put:
      summary: 利用token修改个人信息
      deprecated: false
      description: ''
      tags:
        - 个人信息页
      parameters:
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 用户名
                email:
                  type: string
                  description: 邮箱
                name:
                  type: string
                  description: 姓名
                phone:
                  type: string
                  description: 电话
                major:
                  type: string
                  description: 专业
                github:
                  type: string
                  description: GitHub地址
                deptId:
                  type: integer
                  description: 部门ID
                status:
                  type: integer
                  description: 用户状态（仅代码允许）
              description: 支持部分字段更新（password 将被拒绝）
            example:
              name: 李四
              phone: '13136397218'
              major: 计算机科学与技术
              deptId: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 操作成功
                  data:
                    nullable: true
                    example: null
                required:
                  - code
                  - message
                  - data
          headers: {}
      security:
        - Jwt: []
    get:
      summary: 利用token查询个人信息
      deprecated: false
      description: ''
      tags:
        - 个人信息页
      parameters:
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      awardExperiences:
                        type: array
                        items:
                          type: object
                          properties:
                            awardId:
                              type: integer
                            userId:
                              type: integer
                            awardName:
                              type: string
                            awardTime:
                              type: string
                              format: date
                            description:
                              type: string
                      user:
                        type: object
                        properties:
                          userId:
                            type: integer
                          username:
                            type: string
                          password:
                            type: string
                          name:
                            type: string
                          email:
                            type: string
                          phone:
                            type: string
                          major:
                            type: string
                          github:
                            type: string
                          deptId:
                            type: integer
                          avatar:
                            type: string
                          createTime:
                            type: string
                          status:
                            type: integer
                          isDeleted:
                            type: integer
                          updateTime:
                            type: string
                        required:
                          - userId
                          - username
                          - password
                          - name
                          - email
                          - phone
                          - createTime
                          - updateTime
                          - major
                          - github
                          - deptId
                          - avatar
                          - status
                          - isDeleted
                    required:
                      - awardExperiences
                      - user
                required:
                  - code
                  - message
                  - data
          headers: {}
      security:
        - Jwt: []
  /api/awards:
    put:
      summary: 修改获奖经历
      deprecated: false
      description: ''
      tags:
        - 个人信息页
      parameters:
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                awardId:
                  type: integer
                  description: 奖项经历ID
                awardName:
                  type: string
                  description: 奖项名称
                awardTime:
                  type: string
                  format: date
                  description: 获奖日期（yyyy-MM-dd）
                description:
                  type: string
                  description: 说明/描述
                userId:
                  type: integer
                  description: 用户ID（会被服务端忽略/覆盖）
              required:
                - awardId
            example:
              awardId: 15
              awardName: ACM金牌!
              awardTime: '2025-07-11'
              description: '666666666'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: 'null'
                required:
                  - code
                  - message
                  - data
          headers: {}
      security:
        - Jwt: []
    post:
      summary: 创建获奖经历
      deprecated: false
      description: ''
      tags:
        - 个人信息页
      parameters:
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                awardId:
                  type: integer
                  description: 奖项经历ID（可选）
                userId:
                  type: integer
                  description: 用户ID（创建时必填）
                awardName:
                  type: string
                  description: 奖项名称
                awardTime:
                  type: string
                  format: date
                  description: 获奖日期（yyyy-MM-dd）
                description:
                  type: string
                  description: 说明/描述
              required:
                - userId
                - awardName
                - awardTime
                - description
            example:
              userId: 2
              awardName: 蓝桥杯省赛一等奖
              awardTime: '2024-12-01'
              description: 软件类大学 B 组
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      award_id:
                        type: integer
                    required:
                      - award_id
                required:
                  - code
                  - message
                  - data
          headers: {}
      security:
        - Jwt: []
