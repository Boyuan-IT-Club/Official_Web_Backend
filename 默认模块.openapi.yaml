      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseMessageInterviewBookingAsyncResult'
        '403':
          description: 无权查看他人 requestId（3406）
        '404':
          description: requestId 不存在或已过期（3409）
      security:
        - bearer: []
