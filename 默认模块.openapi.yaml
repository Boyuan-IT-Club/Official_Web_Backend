  /api/interview/booking/cycles/{cycleId}/segments:
    get:
      summary: 可预约面试时间段列表（含已约/共计）
      deprecated: false
      description: |
        返回指定招募周期下可预约的面试时段列表，结构与实体 **`InterviewSlot`** 一致（`slotId`、`interviewDate`、`startTime`、`endTime` 等为 **24 小时制** `HH:mm:ss`）。

        **已约/共计**：使用 `currentOccupied` / `maxCapacity`（如 `7/30`）。`fullyBooked=true` 或 `status=2` 时不可再预约。`location` 可为 null（线上面试等场景）。

        列表查询时会预热 Redis 剩余名额缓存。预约成功后精确 `interviewTime` 在占坑时自动写入（均分大时段），无需单独切分接口。
      tags:
        - 面试预约（学生）
        - interview-booking
      parameters:
        - name: cycleId
          in: path
          description: 招募活动/招新周期 ID
          required: true
          schema:
            type: integer
        - name: resumeSubmittedOnly
          in: query
          description: 为 true 时仅当当前用户在该周期下简历已提交（status≥2）才返回列表，避免未交简历先占位
          required: false
          schema:
            type: boolean
            default: true
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewBookingSegmentsResponse'
        '400':
          description: 参数错误或周期不可预约
      security:
        - bearer: []
  /api/interview/booking:
    post:
      summary: 预约某一面试时间段（创建或覆盖）
      deprecated: false
      description: |
        同一用户在同一 `cycleId` 下仅保留一条有效预约（`uk_resume_cycle`）。

        **同步模式**（`booking.seckill.enabled=false`）：DB 原子占坑后立即返回 `InterviewBooking`，含自动分配的 `interviewTime`。

        **秒杀模式**（默认 `booking.seckill.enabled=true`）：Redis Lua 预扣 → MQ 异步落库 → 通常返回 **202** 及 `requestId`（`status=PENDING`），客户端轮询 `GET /api/interview/booking/requests/{requestId}`。若同 slot 已有效预约或幂等命中已完成记录，可返回 **200** 及完整 `InterviewBooking`。

        精确 `interviewTime` = 大时段开始时间 + `(endTime-startTime)/maxCapacity × (占坑序号-1)`。

        限流：同一用户 60 秒内最多 10 次（HTTP 429，业务码 4291）。
      tags:
        - 面试预约（学生）
        - interview-booking
      parameters:
        - name: Idempotency-Key
          in: header
          description: 可选。防重复提交；相同 key 在 TTL 内返回首次受理结果（含 requestId）
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterviewBookingRequest'
      responses:
        '200':
          description: 同步预约成功，或秒杀模式下幂等/已预约同 slot 直接成功
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ResponseMessageInterviewBooking'
                  - $ref: '#/components/schemas/ResponseMessageInterviewBookingAsyncResult'
        '202':
          description: 秒杀模式已受理，排队落库中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseMessageInterviewBookingAsyncResult'
        '400':
          description: 参数错误、简历未提交、时段不可用等
        '409':
          description: 时段已满（3402）或已有有效预约需走改期（3408）
        '429':
          description: 请求过于频繁（4291），响应头含 Retry-After
      security:
        - bearer: []
  /api/interview/booking/seckill:
    post:
      summary: 秒杀预约（支持异步受理）
      deprecated: false
      description: |
        与 `POST /api/interview/booking` 在秒杀开启时行为一致。通常走异步链路并返回 **202 Accepted**；
        若已存在同一时段有效预约或幂等命中已完成记录，可直接返回 **200** 及 `SUCCESS` 结果（`data.booking` 含预约详情）。
        流程：Lua 预扣 Redis 库存 → 写 PENDING 状态 → RabbitMQ 落库 → 异步邮件通知（大时段信息）。
        支持请求头 `Idempotency-Key`。
      tags:
        - 面试预约（学生）
        - interview-booking
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterviewBookingRequest'
      responses:
        '200':
          description: 已有同一时段有效预约，或幂等命中已完成结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseMessageInterviewBookingAsyncResult'
        '202':
          description: 已受理，返回 requestId 与 PENDING 状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseMessageInterviewBookingAsyncResult'
        '400':
          description: 业务校验失败
        '409':
          description: 名额已满或用户周期锁冲突
        '429':
          description: 限流
      security:
        - bearer: []
  /api/interview/booking/requests/{requestId}:
    get:
      summary: 轮询秒杀预约结果
      deprecated: false
      description: |
        根据 `requestId` 查询异步预约状态：`PENDING` | `SUCCESS` | `FAILED`。
        `SUCCESS` 时 `data.booking` 含完整预约及 `interviewTime`。
      tags:
