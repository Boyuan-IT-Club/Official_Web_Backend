components:
  schemas:
    ResumeFieldDefinition:
      type: object
      description: 简历字段定义，与实体 `ResumeFieldDefinition` 一致
      properties:
        fieldId:
          type: integer
          description: 字段定义 ID
        cycleId:
          type: integer
          description: 招募周期 ID
        fieldKey:
          type: string
          description: 字段唯一键名（同周期内唯一），程序识别用，如 `name`、`email`
        fieldLabel:
          type: string
          description: 字段展示标签（给用户看）
        fieldType:
          type: string
          description: |
            字段类型，决定前端渲染控件：
            - `text` 单行文本
            - `textarea` 多行文本
            - `select` 下拉框
            - `radio` 单选
            - `checkbox` 多选
            - `file` 文件上传
          default: text
          example: text
        placeholder:
          type: string
          nullable: true
          description: 输入框占位提示文案
          example: 请输入您的姓名
        isRequired:
          type: boolean
          description: 是否必填
        sortOrder:
          type: integer
          description: 排序号（升序展示）
        isActive:
          type: boolean
          description: 是否启用
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - fieldId
        - cycleId
        - fieldKey
        - fieldLabel
        - fieldType
        - isRequired
        - sortOrder
        - isActive
        - createdAt
        - updatedAt

    ResumeFieldDefinitionCreateRequest:
      type: object
      description: 创建简历字段定义请求体
      properties:
        fieldId:
          type: integer
          description: 字段定义 ID（新增时可省略）
        cycleId:
          type: integer
        fieldKey:
          type: string
        fieldLabel:
          type: string
        fieldType:
          type: string
          description: 未传时后端默认 `text`
          default: text
          example: textarea
        placeholder:
          type: string
          nullable: true
          example: 请简要介绍自己
        isRequired:
          type: boolean
        sortOrder:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - cycleId
        - fieldKey
        - fieldLabel
        - isRequired
        - sortOrder
        - isActive

    ResumeFieldDefinitionUpdateRequest:
      type: object
      description: 更新简历字段定义请求体
