  /api/interview/feishu/import:
    post:
      summary: 提交飞书导出任务（异步，平台 → 飞书）
      deprecated: false
      description: |
        创建 **PUSH** 导入任务（`taskType=PUSH_TO_FEISHU`）并投递 RabbitMQ，**立即返回** `taskId` 与初始状态 `PENDING`；实际写飞书在消费者中执行。

        请使用 `GET /api/interview/feishu/import/tasks/{taskId}` 轮询，直至终态：
        `SUCCESS`（全部成功）、`PARTIAL_SUCCESS`（部分成功）、`FAILED`（失败）。

        导入逻辑（与消费者内 `FeishuImportExecutor` 一致）：
        - 筛选 `interview_schedule.status=1`；默认仅 `sync_status=0`；`forceUpdate=true` 时包含已同步记录
        - 按 **面试地点**（`interview_slot.location`）分桶，写入对应 `feishu_table_url`（请求体 `feishuTableUrl` 可覆盖 slot 配置）
        - 桶内按 **面试时间** 升序；多地点桶 **并行** 调用飞书 `batch_create` / `batch_update`（已有 `feishu_record_id` 时更新）
        - `forceUpdate=true` 时对已同步记录 **追加/更新行**，不删飞书旧数据

        **写入飞书的列**（见 `FeishuBitableColumns`）：姓名、意向部门、年级、专业、自我介绍、简历评分等。
        **留空待面试官填写**：第一类问题、第二类问题、第三类问题、面试评价、预选、调剂、记录人等。

        鉴权：飞书开放平台 `FEISHU_APP_ID` / `FEISHU_APP_SECRET`。
        权限：`resume:audit`。
      tags:
        - 面试关联飞书模块
        - feishu-integration
      parameters:
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportFeishuRequest'
        required: true
      responses:
        '200':
          description: 任务已创建并已投递 MQ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseMessageFeishuSyncTaskSubmit'
          headers: {}
      security: []
  /api/interview/feishu/import/tasks/{taskId}:
    get:
      summary: 查询飞书同步任务状态（轮询）
      deprecated: false
      description: |
        读取 Redis 中的任务状态与汇总结果。`status=RUNNING` 时继续轮询；终态后：
        - `taskType=PUSH_TO_FEISHU`：`data.result` 含按地点分组的导出明细（`locations`）
        - `taskType=PULL_FROM_FEISHU`：`data.pullResult` 含逐行拉回明细（`rows`）

        `importedCount` 含义随任务类型变化：PUSH 为写入飞书条数，PULL 为成功写入平台条数。

        权限：`resume:audit`。
      tags:
        - 面试关联飞书模块
        - feishu-integration
      parameters:
        - name: taskId
          in: path
          description: 提交导入时返回的任务 ID
          required: true
          schema:
            type: integer
            format: int64
            example: 1
        - name: Authorization
          in: header
          description: ''
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      responses:
        '200':
          description: 查询成功（任务存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseMessageFeishuSyncTaskStatus'
          headers: {}
        '400':
          description: 任务不存在或已过期（Redis TTL 默认 7 天）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          headers: {}
      security: []
  /api/interview/feishu/import/tasks/{taskId}/stream:
    get:
      summary: SSE 订阅飞书同步任务进度
      deprecated: false
      description: |
        `text/event-stream`，事件名 `status`，data 为 `FeishuSyncTaskStatus` JSON。
        适用于 PUSH（`import`）与 PULL（`import-from-table`）两类任务。
        推送字段含 `taskType`、`progressPercent`、`completedSteps`/`totalSteps`（PULL 按行进度）。
        终态 `SUCCESS` / `PARTIAL_SUCCESS` / `FAILED` 后连接关闭。权限 `resume:audit`。
      tags:
