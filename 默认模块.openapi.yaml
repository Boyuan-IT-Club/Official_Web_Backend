    InterviewBookableSlot:
      description: |
        可预约面试时段，字段与实体 `InterviewSlot` 一致；另含派生字段 `fullyBooked`（是否已满不可约）。
        前端展示时段请用 `interviewDate` + `startTime`～`endTime`（24 小时制），勿使用「上午/下午」文案。
      allOf:
        - $ref: '#/components/schemas/InterviewSlot'
        - type: object
          properties:
            fullyBooked:
              type: boolean
              description: 是否已满不可约（`currentOccupied >= maxCapacity` 或 `status=2`）
              example: false
          required:
            - fullyBooked

    InterviewBookingSegmentsResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: 操作成功
        data:
          type: array
          items:
            $ref: '#/components/schemas/InterviewBookableSlot'
      required:
        - code
        - message
        - data

    InterviewSchedule:
      type: object
      description: 实体 `InterviewSchedule`（面试安排/预约记录）
      properties:
        scheduleId:
          type: integer
          description: 主键 schedule_id
          example: 5001
        resumeId:
          type: integer
          example: 120
        cycleId:
          type: integer
          example: 2
        slotId:
          type: integer
          description: 外键，关联 interview_slot.slot_id
          example: 55
        interviewTime:
          type: string
          format: date-time
          nullable: true
          description: |
            精确到场时间。预约/改期占坑成功后由后端按大时段均分自动写入：
            开始时间 + (endTime-startTime)/maxCapacity × (占坑序号-1)。取消后为 null。
        status:
          type: integer
          description: 0-未安排，1-已安排，2-已取消
          example: 1
        notes:
          type: string
          nullable: true
          description: 安排备注
        syncStatus:
          type: integer
          description: 0-未同步，1-已同步
          example: 0
        notifStatus:
          type: integer
          description: 0-未通知，1-已通知
          example: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - scheduleId
        - resumeId
        - cycleId
        - slotId
        - status

    CreateInterviewBookingRequest:
      type: object
      required:
        - cycleId
        - slotId
      properties:
        cycleId:
          type: integer
          description: 招募活动 ID，对应 recruitment_cycle.cycle_id
          example: 2
        slotId:
          type: integer
          description: 选中的面试时段 ID，对应 interview_slot.slot_id
          example: 55
        notes:
          type: string
          nullable: true
          description: 写入 interview_schedule.notes（可选）

    UpdateInterviewBookingRequest:
      type: object
      required:
        - slotId
      properties:
        slotId:
          type: integer
          description: 改约到的新 slot_id（须未约满）
          example: 56
        notes:
          type: string
          nullable: true

    InterviewBooking:
      type: object
      description: |
        学生预约详情：`InterviewSchedule` 字段 + 关联 `InterviewSlot` 的日期与 24 小时制时段。
        路径中的 `bookingId` 即 `scheduleId`。
      allOf:
        - $ref: '#/components/schemas/InterviewSchedule'
        - type: object
          properties:
            interviewDate:
              type: string
              format: date
              description: 来自关联 InterviewSlot.interviewDate
              example: '2026-03-27'
            startTime:
              type: string
              format: time
              description: 来自 InterviewSlot.startTime（24 小时制 HH:mm:ss）
              example: '09:00:00'
            endTime:
              type: string
              format: time
              description: 来自 InterviewSlot.endTime（24 小时制 HH:mm:ss）
              example: '12:00:00'
            location:
              type: string
              nullable: true
              description: 来自 InterviewSlot.location，可为空
            interviewType:
              type: integer
              description: 来自 InterviewSlot，1-线下 2-线上
              example: 1
            meetingLink:
              type: string
              nullable: true
              description: 来自 InterviewSlot.meetingLink
            maxCapacity:
              type: integer
              description: 来自 InterviewSlot.maxCapacity（共计）
              example: 30
            currentOccupied:
              type: integer
              description: 来自 InterviewSlot.currentOccupied（已约）
              example: 7
            feishuTableUrl:
              type: string
              nullable: true
              description: 来自 InterviewSlot.feishuTableUrl
            slotStatus:
              type: integer
              description: 来自 InterviewSlot.status，1-可用 2-已满 3-关闭
              example: 1
          required:
            - interviewDate
            - startTime
            - endTime

    ResponseMessageInterviewBooking:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/InterviewBooking'
      required:
        - code
        - message
        - data

    ResponseMessageInterviewBookingNullable:
      type: object
      description: 无预约时 `data` 为 null；有预约时与 `ResponseMessageInterviewBooking` 结构相同
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InterviewBooking'
      required:
        - code
        - message
        - data

