        '400':
          description: 任务不存在或已过期
      security: []
  /api/interview/feishu/import-from-table:
    post:
      summary: 提交飞书拉回任务（异步）
      deprecated: false
      description: |
        从飞书多维表格 **拉回** 面试录取结果并写入平台，创建异步任务后立即返回 `taskId`。
        任务类型为 `PULL_FROM_FEISHU`；进度查询与 SSE 订阅与 PUSH 任务共用同一组接口。

        **飞书表格必需列**（列名须完全一致，见 `FeishuBitableColumns`）：
        - `姓名`：与平台简历 EAV 中 `name` 字段匹配（同周期内姓名应唯一）
        - `录取部门`（或兼容旧列名 `部门`）
        - `面试是否通过`（复选框）
        - `面试是否通过（预选）`（复选框）
        - `是否调剂`（复选框）
        - `决定人`（人员字段，支持 `@姓名` 格式；未匹配到平台用户时使用操作人）

        **写入逻辑**（消费者内 `FeishuTablePullImportExecutor`）：
        - 按姓名匹配本周期 `interview_schedule` → 创建或更新 `interview_result`
        - `updateUserDept=true`（默认）时，同步更新 `user.dept_id` 为录取部门
        - 分页同步读取飞书全表；单行失败计入 `failedCount`，不阻断其他行

        权限：`resume:audit`。
      tags:
        - 面试关联飞书模块
        - feishu-integration
      parameters:
        - name: Authorization
          in: header
          example: Bearer {{token}}
          schema:
            type: string
            default: Bearer {{token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportFromFeishuTableRequest'
            example:
              cycleId: 2
              feishuTableUrl: https://example.feishu.cn/base/AppToken?table=tblXXXX
              updateUserDept: true
      responses:
        '200':
          description: 任务已创建并已投递 MQ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseMessageFeishuSyncTaskSubmit'
        '400':
          description: 参数错误或飞书表格为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security: []
