          description: 字段值 ID
        resumeId:
          type: integer
          description: 简历 ID
        fieldId:
          type: integer
          description: 字段 ID
        fieldValue:
          type: string
          description: 字段值
        fieldKey:
          type: string
          description: 字段键（唯一标识）
        fieldLabel:
          type: string
          description: 字段显示名
        fieldType:
          type: string
          description: 字段类型
        placeholder:
          type: string
          nullable: true
          description: 输入提示文案
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        updatedAt:
          type: string
          format: date-time
          description: 更新时间
      required:
      - valueId
      - resumeId
      - fieldId
      - fieldValue
      - createdAt
      - updatedAt
