                  message: { type: string }
                required: [code, message]
  /api/resumes/attachments/{id}/content:
    get:
      summary: 取简历附件内容（预览 / 下载）
      description: >-
        附件是申请人的个人资料，走本接口逐次鉴权，**不在** /api/files 的公开白名单里。

        inline=true 时尝试内联返回，但是否真的内联由服务端决定：只有
        PDF / 常见图片 / 纯文本 / 音视频这类「浏览器渲染但不执行脚本」的类型才内联，
        其余（含 text/html 与 image/svg+xml）一律 Content-Disposition: attachment。
        响应固定带 X-Content-Type-Options: nosniff 与沙箱 CSP。

        前端不能把本地址直接塞进 img/iframe 的 src —— 那样发出的请求不带
        Authorization 头，一律 401。应先取回 blob 再用 blob: URL 渲染。
      tags: [简历相关接口]
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
      - name: inline
        in: query
        required: false
        schema: { type: boolean, default: false }
      responses:
        '200':
          description: 文件内容
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
