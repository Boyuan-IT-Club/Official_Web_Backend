components:
  schemas:
    RescheduleRequest:
      type: object
      description: 面试改期申请
      properties:
        requestId:
          type: integer
        scheduleId:
          type: integer
        resumeId:
          type: integer
        userId:
          type: integer
        cycleId:
          type: integer
        reason:
          type: string
        preferredTimeSlotIds:
          type: string
          nullable: true
          description: 期望时间窗ID列表（逗号分隔）
        status:
          type: integer
          description: 0待处理 1已同意 2已拒绝
        adminNote:
          type: string
          nullable: true
        handledBy:
          type: integer
          nullable: true
        handledAt:
          type: string
          nullable: true
        createdAt:
          type: string
          nullable: true
    RescheduleRequestEnvelope:
      type: object
      properties:
        code:
          type: integer
          description: 业务状态码（200 表示成功）
        message:
          type: string
          description: 提示信息
        data:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/RescheduleRequest'
      required:
      - code
      - message
    ResumeFieldDefinition:
      type: object
      description: 简历字段定义，与实体 `ResumeFieldDefinition` 一致
      properties:
        fieldId:
          type: integer
          description: 字段定义 ID
        cycleId:
          type: integer
          description: 招募周期 ID
        fieldKey:
          type: string
          description: 字段唯一键名（同周期内唯一），程序识别用，如 `name`、`email`
        fieldLabel:
          type: string
          description: 字段展示标签（给用户看）
        fieldType:
          type: string
          description: '字段类型，决定前端渲染控件：

            - `text` 单行文本

            - `textarea` 多行文本

            - `select` 下拉框

            - `radio` 单选

            - `checkbox` 多选

            - `file` 文件上传

            '
          default: text
          example: text
        placeholder:
          type: string
          nullable: true
          description: 输入框占位提示文案
          example: 请输入您的姓名
        isRequired:
          type: boolean
          description: 是否必填
        sortOrder:
          type: integer
          description: 排序号（升序展示）
        isActive:
          type: boolean
          description: 是否启用
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        updatedAt:
          type: string
          format: date-time
          description: 更新时间
      required:
      - fieldId
      - cycleId
      - fieldKey
      - fieldLabel
      - fieldType
      - isRequired
      - sortOrder
      - isActive
      - createdAt
      - updatedAt
    ResumeFieldDefinitionCreateRequest:
      type: object
      description: 创建简历字段定义请求体
      properties:
        fieldId:
          type: integer
          description: 字段定义 ID（新增时可省略）
        cycleId:
          type: integer
          description: 招募周期 ID
        fieldKey:
          type: string
          description: 字段键（唯一标识）
        fieldLabel:
          type: string
          description: 字段显示名
        fieldType:
          type: string
          description: 未传时后端默认 `text`
          default: text
          example: textarea
        placeholder:
          type: string
          nullable: true
          example: 请简要介绍自己
          description: 输入提示文案
        isRequired:
          type: boolean
          description: 是否必填
        sortOrder:
          type: integer
          description: 排序序号
        isActive:
          type: boolean
          description: 是否启用
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        updatedAt:
          type: string
          format: date-time
          description: 更新时间
      required:
      - cycleId
      - fieldKey
      - fieldLabel
      - isRequired
      - sortOrder
      - isActive
    ResumeFieldDefinitionUpdateRequest:
      type: object
      description: 更新简历字段定义请求体
      allOf:
      - $ref: '#/components/schemas/ResumeFieldDefinitionCreateRequest'
      required:
      - fieldId
      - cycleId
      - fieldKey
      - fieldLabel
      - isRequired
      - sortOrder
      - isActive
    SimpleResumeField:
      type: object
      description: 简历详情中的简化字段项（含字段定义元信息）
      properties:
        fieldId:
          type: integer
          description: 字段 ID
        fieldKey:
          type: string
          description: 字段键名
        fieldLabel:
          type: string
          description: 字段显示名
        fieldType:
          type: string
          description: 字段类型，同 `ResumeFieldDefinition.fieldType`
        placeholder:
          type: string
          nullable: true
          description: 输入提示文案
        fieldValue:
          type: string
          description: 用户填写的值
      required:
      - fieldId
      - fieldLabel
      - fieldValue
    ResumeFieldValueDetail:
