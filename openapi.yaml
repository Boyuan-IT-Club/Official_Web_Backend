    get:
      summary: 查询飞书导入任务状态（轮询）
      deprecated: false
      description: '读取 Redis 中的任务状态与汇总结果。`status=RUNNING` 时继续轮询；

        终态后 `data.result` 含按地点分组的明细（`locations`）。


