      type: object
      description: 实体 `InterviewSchedule`（面试安排/预约记录）
      properties:
        scheduleId:
          type: integer
          description: 主键 schedule_id
          example: 5001
        resumeId:
          type: integer
          example: 120
          description: 简历 ID
        cycleId:
          type: integer
          example: 2
          description: 招募周期 ID
        slotId:
          type: integer
          description: 外键，关联 interview_slot.slot_id
          example: 55
        interviewTime:
          type: string
          format: date-time
          nullable: true
          description: '精确到场时间。预约/改期占坑成功后由后端按大时段均分自动写入：

            开始时间 + (endTime-startTime)/maxCapacity × (占坑序号-1)。取消后为 null。

            '
        status:
          type: integer
