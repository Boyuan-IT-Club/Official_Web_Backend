    post:
      summary: 人工调剂到指定场次（管理员）
      deprecated: false
      description: '方案B：把某位候选人（按简历 ID）一键分配 / 再分配到目标场次。已有有效安排则从原场次释放名额后转入目标场次；没有则新建安排。

        目标场次原子占位，已满返回业务码 3604。转入后按目标场次时长重新计算精确到场时间。需权限 `resume:audit`。

        '
      tags:
      - 面试场次分配（管理员）
