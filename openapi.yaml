        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targetSessionId
              properties:
                targetSessionId:
                  type: integer
                  description: 目标场次 ID
            example:
              targetSessionId: 1001
      responses:
        '200':
          description: 调剂成功，返回该候选人的分配明细
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    example: 操作成功
                    description: 提示信息
                  data:
                    $ref: '#/components/schemas/AssignedCandidate'
                    description: 响应数据
        '409':
          description: 目标场次已满（3604）
