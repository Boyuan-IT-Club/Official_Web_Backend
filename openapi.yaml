  /api/cycles/open:
    get:
      summary: 当前开放投递的周期
      deprecated: false
      description: >-
        返回「现在真的可以投递」的招募周期列表：is_active = 1 且今天落在
        start_date ~ end_date 之间，按 start_date 倒序（前端以第一项为默认选中）。

        与 /api/cycles/active/{isActive} 的区别：is_active 只表示「是否启用」，
        往届周期为了能查历史简历通常也保持启用，所以「启用中」不等于「现在能投」。
        用户端不要再用 active 接口取第一条来判断当前周期。

        本接口以起止日期为权威，不看 status 列 —— status 只有
        /api/cycles/update-statuses 这个手动接口会刷新，没有定时任务，实际长期陈旧。
      tags:
      - 招聘活动相关接口（管理员专属）
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    description: 提示信息
                  data:
                    type: array
                    description: 当前开放投递的周期，可能为空数组（此时无周期在招）
                    items:
                      type: object
                      properties:
                        cycleId:
                          type: integer
                          description: 招募周期 ID
                        cycleName:
                          type: string
                          description: 周期名称
                        academicYear:
                          type: string
                          description: 学年
                        description:
                          type: string
                          nullable: true
                          description: 周期说明
                        startDate:
                          type: string
                          description: 开始日期（yyyy-MM-dd）
                        endDate:
                          type: string
                          description: 截止日期（yyyy-MM-dd）
                        fieldCount:
                          type: integer
                          description: >-
                            该周期已配置的简历字段数。为 0 表示报名表单还没配，
                            投递页无内容可填 —— /api/resumes/fields/{cycleId}
                            在无定义时返回 200 + 空数组且不报错，前端需据此提示，
                            否则表现为一张空白表单。
                      required:
                      - cycleId
                      - cycleName
                      - startDate
                      - endDate
                      - fieldCount
                required:
                - code
                - message
                - data
          headers: {}
  /api/cycles/upcoming:
    get:
      summary: 即将开放的周期（预告）
      deprecated: false
      description: >-
        返回「还没开始、但已经可以预告」的招募周期：is_active = 1 且
        start_date 晚于今天，按 start_date 升序（最快开始的排最前）。

        与 /api/cycles/open 分开而不是并成一个列表：前端拿 open 的 id 集合当
        「能不能投」的闸门，未开始的混进去，用户就能给一个还没开始的周期提交简历。
        可见与可投是两件事 —— 未开始的周期该看得到（做预告卡片），但不该能投。

        与 open 一样以起止日期为权威，不看 status 列。
      tags:
      - 招聘活动相关接口（管理员专属）
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    description: 提示信息
                  data:
                    type: array
                    description: 即将开放的周期，可能为空数组（此时没有已排期的下一届）
                    items:
                      type: object
                      properties:
                        cycleId:
                          type: integer
                          description: 招募周期 ID
                        cycleName:
                          type: string
                          description: 周期名称
                        academicYear:
                          type: string
                          description: 学年
                        description:
                          type: string
                          nullable: true
                          description: 周期说明，预告卡片会展示
                        startDate:
                          type: string
                          description: 开始日期（yyyy-MM-dd）。预告以此计算「还有几天开始」
                        endDate:
                          type: string
                          description: 截止日期（yyyy-MM-dd）
                        fieldCount:
                          type: integer
                          description: 该周期已配置的简历字段数
                      required:
                      - cycleId
                      - cycleName
                      - startDate
                      - endDate
                      - fieldCount
                required:
                - code
                - message
                - data
          headers: {}
  /api/resumes/{resumeId}/attachments:
    get:
      summary: 列出简历附件
      description: 学生看自己的、面试官看候选人的，同一个接口。仅需登录。
      tags: [简历相关接口]
      parameters:
      - name: resumeId
        in: path
        required: true
        schema: { type: integer }
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        resumeId: { type: integer }
                        fileName: { type: string, description: 原始文件名 }
                        contentType: { type: string, nullable: true }
                        sizeBytes: { type: integer, format: int64 }
                        createdAt: { type: string, nullable: true }
                        previewable:
                          type: boolean
                          description: >-
                            浏览器能否安全地内联预览。由服务端判定，前端不要自己猜类型：
                            这份判断是安全边界，text/html 与 image/svg+xml 一律为 false，
                            内联它们等于让上传者在管理端的源上执行脚本。
                      required: [id, fileName, sizeBytes, previewable]
                required: [code, message, data]
    post:
      summary: 上传简历附件
      description: >-
        任意格式，单个不超过 20MB、每份简历最多 10 个。只能传到自己的简历上，
        且该周期须开放投递。同名视为替换。
      tags: [简历相关接口]
      parameters:
      - name: resumeId
        in: path
        required: true
        schema: { type: integer }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data: { type: object }
                required: [code, message]
