          nullable: true
          description: '精确到场时间。预约/改期占坑成功后由后端按大时段均分自动写入：

            开始时间 + (endTime-startTime)/maxCapacity × (占坑序号-1)。取消后为 null。

            '
        status:
          type: integer
          description: 0-未安排，1-已安排，2-已取消
          example: 1
        notes:
          type: string
          nullable: true
          description: 安排备注
        syncStatus:
          type: integer
          description: 0-未同步，1-已同步
          example: 0
        notifStatus:
          type: integer
          description: 0-未通知，1-已通知
          example: 0
