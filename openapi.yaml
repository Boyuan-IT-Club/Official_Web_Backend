          description: 总导入成功条数
          example: 10
        failedCount:
          type: integer
          description: 总失败条数
          example: 0
        skippedCount:
          type: integer
          description: 跳过条数（缺 slot、未配置 feishu_table_url 等）
          example: 0
        locations:
          type: array
          description: 按面试地点分组的导入结果
          items:
            $ref: '#/components/schemas/FeishuLocationImportResult'
    FeishuSyncTaskStatus:
      type: object
      description: 轮询接口返回的 data
      required:
      - taskId
      - status
      properties:
        taskId:
          type: integer
          format: int64
          example: 42
          description: 异步任务 ID
        status:
          $ref: '#/components/schemas/FeishuSyncTaskStatusEnum'
          description: 状态
        importedCount:
          type: integer
          description: 汇总成功条数（终态时有值）
          example: 10
        failedCount:
          type: integer
          description: 汇总失败条数
          example: 0
        skippedCount:
          type: integer
          description: 跳过条数
          example: 1
        errorMessage:
          type: string
          description: 失败时的错误信息
          nullable: true
        result:
          $ref: '#/components/schemas/ImportFeishuImportResult'
          description: 终态时的按地点明细；RUNNING 时可能为空
        createdAt:
          type: string
          format: date-time
          description: 任务创建时间
        startedAt:
          type: string
          format: date-time
          description: 开始执行时间
          nullable: true
        finishedAt:
          type: string
          format: date-time
          description: 结束时间
          nullable: true
