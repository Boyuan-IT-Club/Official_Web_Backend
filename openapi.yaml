openapi: 3.0.1
info:
  title: 博远社团官网 API
  description: '博远信息技术社官网后端面试模块的完整 API 接口文档。


    **面试分配（方案 B，当前流程）**：

    1. 管理员维护**时间窗**（`InterviewTimeSlot`，大时段，如“周六上午”）与**场次**（`InterviewSession` = 部门 × 时间窗 × 地点 × 容量）——见「面试场次管理（管理员）」。

    2. 学生提交**志愿**（至多两个志愿部门 + 勾选可接受时间窗）——见「面试志愿（学生）」。

    3. 管理员**一键分配**：每人只面一场，先匹配第一志愿有空场次，满了自动降级第二志愿，都不行进入待调剂名单；命中后按场次 `interviewDurationMinutes` 把时间窗细分到每人精确时刻并写入 `InterviewSchedule`。人工调剂可一键把候选人再分配到其它有空场次——见「面试场次分配（管理员）」。


    **已下线：自助抢/秒杀预约**。原 `POST /api/interview/booking`、`/api/interview/booking/seckill` 等自助抢接口已弃用（`booking.seckill.enabled=false`），改由“志愿提交 + 管理员场次分配”替代。文档中相关路径标记为 `deprecated`。


    **飞书多维表格导入**：`POST /api/interview/feishu/import` 异步导入（返回 `taskId`，SSE `.../tasks/{taskId}/stream` 推送进度，轮询 `.../tasks/{taskId}` 兜底）；`POST /api/interview/feishu/import-from-table` 为同步导入。按面试地点分桶并行写入各 `feishu_table_url`。

    '
  version: 1.0.0
tags:
- name: 登录注册页
  description: 账号注册、登录、登出、短信/邮箱验证码与密码重置
- name: 个人信息页
  description: 当前登录用户的资料查询/修改、头像与文件上传、获奖经历维护
- name: 简历相关功能——普通用户
  description: 学生获取/填写/提交本人简历及自定义字段值
- name: 简历相关功能——管理员
  description: 管理员维护简历字段定义、审核简历状态、检索与导出简历
- name: 招聘活动相关接口（管理员专属）
  description: 招募周期（cycle）的增删改查、分页检索与状态自动维护
- name: 社团活动模块
  description: 社团活动的发布、更新、分类查询与展示
- name: 面试志愿（学生）
  description: 方案B：学生查看可选时间窗、提交与查询本人志愿部门
- name: 面试场次管理（管理员）
  description: 方案B：管理员维护时间窗与场次（部门 × 时间窗 × 地点 × 容量）
- name: 面试场次分配（管理员）
  description: 方案B：一键分配、待人工调剂名单、可用场次查询与人工调剂
- name: 面试关联飞书模块
  description: 面试安排与飞书多维表格之间的导入（同步/异步）与结果导出
- name: 面试结果模块
  description: 面试结果的录入、更新、查询与通知发送
- name: 面试结果统计页
  description: 面试结果统计与报表导出（部分条目为规划中/未实现）
- name: 面试时间地点管理
  description: 【旧流程·已弃用】面试时段（InterviewSlot）配置，已由「面试场次管理」替代
- name: 面试预约（学生）
  description: 【旧流程·已弃用】学生自助预约/秒杀面试时段，已由「面试志愿」替代
- name: 面试预约管理
  description: 【旧流程·已弃用】管理员查看学生预约记录
- name: 面试分配模块
  description: 【旧流程·已弃用】基于预约的自动分配与安排调整，已由「面试场次分配」替代
- name: 角色控制模块
  description: RBAC 角色的查询与详情
- name: 部门模块
  description: 组织部门的增删改查
- name: 权限模块
  description: 权限项（资源/操作）的增删改查
- name: 角色权限管理模块
  description: 角色与权限之间的关联维护
- name: 用户角色管理模块
  description: 用户与角色之间的关联维护
- name: 管理员特殊功能
  description: 管理员对用户账号的管理、批量操作、缓存清理、全局搜索与数据导出
- name: 系统监控
  description: 服务健康检查等运维接口
- name: 评测提交(公开)
  description: 候选人派生仓 GitHub Actions 推送 autograder 加密报告单的公开入库端点(零认证)
- name: 评测(用户)
  description: 当前登录候选人查看自己的评测历史/最新/趋势
paths:
  /api/public/evaluations:
    post:
      summary: 评测提交入库(Autograder Actions 推送)
      deprecated: false
      description: >-
        公开端点(零认证,限频防刷,ADR-0001)。候选人派生仓 Actions 推送加密报告单:
        服务器 Java 解密(AES-256-GCM,ADR-0002)、校验、按报告 sha256 幂等入库。
        重复推送返回已存记录 id。身份键 github_username(来自 GitHub context)。
      security: []
      tags:
      - 评测提交(公开)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - report
              - github_username
              properties:
                report:
                  type: string
                  description: base64(autograding_report.json 原始字节)
                github_username:
                  type: string
                  description: GitHub 登录名(来自 github.actor),可靠身份键
                repository:
                  type: string
                  description: 候选人生成仓 URL
                commit_sha:
                  type: string
                  description: 触发推送的 commit sha
      responses:
        '200':
          description: 成功,返回提交 id(code/message/data)
        '400':
          description: 非法载荷 / 解密失败 / schema 不符
        '429':
          description: 请求过于频繁
  /api/evaluations/me:
    get:
      summary: 我的评测提交历史(分页)
      deprecated: false
      description: 当前登录候选人的全部评测提交,新→旧。
      tags:
      - 评测(用户)
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema: { type: integer, default: 0 }
      - name: size
        in: query
        schema: { type: integer, default: 10 }
      responses:
        '200':
          description: 分页的提交列表
  /api/evaluations/me/latest:
    get:
      summary: 我的最新评测
      deprecated: false
      description: 最新一次提交;无则 data 为 null。
      tags:
      - 评测(用户)
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 最新提交或 null
  /api/evaluations/me/trend:
    get:
      summary: 我的得分趋势
      deprecated: false
      description: 得分随时间升序的点序列(供趋势图)。
      tags:
      - 评测(用户)
      security:
      - bearerAuth: []
      responses:
        '200':
          description: [{evaluatedAt, totalScore}]
  /api/auth/register:
    post:
      summary: 社团官网-注册
      deprecated: false
      description: 注册社团官网账号。校验用户名/邮箱唯一性及验证码，成功后创建普通用户账号。
      tags:
      - 登录注册页
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 用户名
                password:
                  type: string
                  description: 密码
                confirmPassword:
                  type: string
                  description: 确认密码
                name:
                  type: string
                  description: 姓名
                email:
                  type: string
                  description: 邮箱
                phone:
                  type: string
                  description: 手机号
                emailCode:
                  type: string
                  description: 邮箱验证码
              required:
              - username
              - password
              - confirmPassword
              - name
              - email
              - phone
              - emailCode
            example:
              username: Student100
              password: PASSWORD666!
              confirmPassword: PASSWORD666!
              name: 张三
              email: 10245101417@stu.ecnu.edu.cn
              phone: '13136397218'
              emailCode: '762120'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    properties:
                      userId:
                        type: integer
                        description: 用户 ID
                      username:
                        type: string
                        description: 用户名
                    required:
                    - userId
                    - username
                    description: 响应数据
                required:
                - code
                - message
                - data
          headers: {}
      security: []
  /api/auth/login:
    post:
      summary: 社团官网-登录
      deprecated: false
      description: 使用用户名/邮箱 + 密码登录，成功后返回 JWT 令牌；后续受保护接口需在 Authorization 头携带 `Bearer {token}`。
      tags:
      - 登录注册页
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auth_id:
                  type: string
                  description: 认证ID（email/phone/username，取决于 auth_type）
                auth_type:
                  type: string
                  description: 认证类型
                  example: username-password
                verify:
                  type: string
                  description: 验证信息（密码或验证码）
              required:
              - auth_id
              - auth_type
              - verify
            example:
              auth_id: admin
              auth_type: username-password
              verify: PASS123!
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        description: 用户 ID
                      token:
                        type: string
                        description: 登录令牌（JWT）
                      roleNames:
                        type: array
                        items:
                          type: string
                        description: 角色名称列表
                    required:
                    - user_id
                    - token
                    - roleNames
                    description: 响应数据
                required:
                - code
                - message
                - data
          headers: {}
      security: []
  /api/auth/reset-password:
    post:
      summary: 重置密码
      deprecated: false
      description: 通过邮箱或手机验证码校验身份后重置登录密码。
      tags:
      - 登录注册页
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: 邮箱或手机号
                code:
                  type: string
                  description: 验证码（6位数字）
                  example: '123456'
                newPassword:
                  type: string
                  description: 新密码
              required:
              - identifier
              - code
              - newPassword
            example:
              identifier: 10245101417@stu.ecnu.edu.cn
              code: 156521
              newPassword: h23121321005
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    example: 操作成功
                    description: 提示信息
                  data:
                    nullable: true
                    example: null
                    description: 响应数据
                required:
                - code
                - message
                - data
          headers: {}
      security: []
  /api/auth/send-email-code:
    post:
      summary: 发送邮箱验证码
      deprecated: false
      description: '生成验证码写入 Redis 后投递 RabbitMQ 异步发信，HTTP 立即返回。限流：同一 IP 60 秒内最多 5 次（超限 HTTP 429，业务码 4291）。

        邮箱须为 `@stu.ecnu.edu.cn` 后缀。

        '
      tags:
      - 登录注册页
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 10245101417@stu.ecnu.edu.cn
                  description: 邮箱
              required:
              - email
            example:
              email: 10245101417@stu.ecnu.edu.cn
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    description: 响应数据
                    nullable: true
                required:
                - code
                - message
                - data
          headers: {}
      security: []
  /api/auth/send-sms-code:
    post:
      summary: 发送手机验证码
      deprecated: false
      description: 向指定手机号发送短信验证码，用于注册或重置密码等场景。
      tags:
      - 登录注册页
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 手机号
                  example: '13136397218'
              required:
              - phone
            example:
              phone: '13136397218'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    description: 响应数据
                    nullable: true
                required:
                - code
                - message
                - data
          headers: {}
      security: []
  /api/auth/logout:
    post:
      summary: 登出（弃用）
      deprecated: false
      description: （已弃用）JWT 为无状态令牌，登出仅需客户端丢弃本地令牌即可；此接口仅为兼容保留。
      tags:
      - 登录注册页
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    description: 响应数据
                    nullable: true
                required:
                - code
                - message
                - data
          headers: {}
      security: []
  /api/user/me:
    put:
      summary: 利用token修改个人信息
      deprecated: false
      description: 根据当前登录用户身份修改本人可编辑的个人信息（如姓名、专业、GitHub 等）。
      tags:
      - 个人信息页
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 用户名
                email:
                  type: string
                  description: 邮箱
                name:
                  type: string
                  description: 姓名
                phone:
                  type: string
                  description: 电话
                major:
                  type: string
                  description: 专业
                github:
                  type: string
                  description: GitHub地址
                deptId:
                  type: integer
                  description: 部门ID
                status:
                  type: integer
                  description: 用户状态（仅代码允许）
              description: 支持部分字段更新（password 将被拒绝）
            example:
              name: 李四
              phone: '13136397218'
              major: 计算机科学与技术
              deptId: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    example: 操作成功
                    description: 提示信息
                  data:
                    nullable: true
                    example: null
                    description: 响应数据
                required:
                - code
                - message
                - data
          headers: {}
    get:
      summary: 利用token查询个人信息
      deprecated: false
      description: 根据 Authorization 中的 JWT 解析当前登录用户，返回其完整个人信息。
      tags:
      - 个人信息页
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    properties:
                      awardExperiences:
                        type: array
                        items:
                          type: object
                          properties:
                            awardId:
                              type: integer
                              description: 奖项 ID
                            userId:
                              type: integer
                              description: 用户 ID
                            awardName:
                              type: string
                              description: 奖项名称
                            awardTime:
                              type: string
                              format: date
                              description: 获奖时间
                            description:
                              type: string
                              description: 描述
                        description: 获奖经历列表
                      user:
                        type: object
                        properties:
                          userId:
                            type: integer
                            description: 用户 ID
                          username:
                            type: string
                            description: 用户名
                          password:
                            type: string
                            description: 密码
                          name:
                            type: string
                            description: 姓名
                          email:
                            type: string
                            description: 邮箱
                          phone:
                            type: string
                            description: 手机号
                          major:
                            type: string
                            description: 专业
                          github:
                            type: string
                            description: GitHub 主页
                          deptId:
                            type: integer
                            description: 部门 ID
                          avatar:
                            type: string
                            description: 头像 URL
                          createTime:
                            type: string
                            description: 创建时间
                          status:
                            type: integer
                            description: 状态
                          isDeleted:
                            type: integer
                            description: 是否已删除（逻辑删除标记）
                          updateTime:
                            type: string
                            description: 更新时间
                        required:
                        - userId
                        - username
                        - password
                        - name
                        - email
                        - phone
                        - createTime
                        - updateTime
                        - major
                        - github
                        - deptId
                        - avatar
                        - status
                        - isDeleted
                        description: 用户信息
                    required:
                    - awardExperiences
                    - user
                    description: 响应数据
                required:
                - code
                - message
                - data
          headers: {}
  /api/awards:
    put:
      summary: 修改获奖经历
      deprecated: false
      description: 修改当前用户已有的获奖经历（按奖项 ID 定位记录）。
      tags:
      - 个人信息页
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                awardId:
                  type: integer
                  description: 奖项经历ID
                awardName:
                  type: string
                  description: 奖项名称
                awardTime:
                  type: string
                  format: date
                  description: 获奖日期（yyyy-MM-dd）
                description:
                  type: string
                  description: 说明/描述
                userId:
                  type: integer
                  description: 用户ID（会被服务端忽略/覆盖）
              required:
              - awardId
            example:
              awardId: 15
              awardName: ACM金牌!
              awardTime: '2025-07-11'
              description: '666666666'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    description: 响应数据
                    nullable: true
                required:
                - code
                - message
                - data
          headers: {}
    post:
      summary: 创建获奖经历
      deprecated: false
      description: 为当前登录用户新增一条获奖/荣誉经历。
      tags:
      - 个人信息页
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                awardId:
                  type: integer
                  description: 奖项经历ID（可选）
                userId:
                  type: integer
                  description: 用户ID（创建时必填）
                awardName:
                  type: string
                  description: 奖项名称
                awardTime:
                  type: string
                  format: date
                  description: 获奖日期（yyyy-MM-dd）
                description:
                  type: string
                  description: 说明/描述
              required:
              - userId
              - awardName
              - awardTime
              - description
            example:
              userId: 2
              awardName: 蓝桥杯省赛一等奖
              awardTime: '2024-12-01'
              description: 软件类大学 B 组
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码（200 表示成功）
                  message:
                    type: string
                    description: 提示信息
