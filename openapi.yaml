    InterviewBooking:
      type: object
      description: '学生预约详情：`InterviewSchedule` 字段 + 关联 `InterviewSlot` 的日期与 24 小时制时段。

        路径中的 `bookingId` 即 `scheduleId`。

        '
      allOf:
      - $ref: '#/components/schemas/InterviewSchedule'
      - type: object
        properties:
          interviewDate:
            type: string
            format: date
            description: 来自关联 InterviewSlot.interviewDate
            example: '2026-03-27'
          startTime:
            type: string
            format: time
            description: 来自 InterviewSlot.startTime（24 小时制 HH:mm:ss）
            example: 09:00:00
          endTime:
            type: string
            format: time
            description: 来自 InterviewSlot.endTime（24 小时制 HH:mm:ss）
            example: '12:00:00'
          location:
            type: string
            nullable: true
            description: 来自 InterviewSlot.location，可为空
          interviewType:
            type: integer
            description: 来自 InterviewSlot，1-线下 2-线上
            example: 1
          meetingLink:
            type: string
            nullable: true
            description: 来自 InterviewSlot.meetingLink
          maxCapacity:
            type: integer
            description: 来自 InterviewSlot.maxCapacity（共计）
            example: 30
          currentOccupied:
            type: integer
            description: 来自 InterviewSlot.currentOccupied（已约）
            example: 7
          feishuTableUrl:
            type: string
            nullable: true
            description: 来自 InterviewSlot.feishuTableUrl
          slotStatus:
            type: integer
            description: 来自 InterviewSlot.status，1-可用 2-已满 3-关闭
            example: 1
        required:
        - interviewDate
        - startTime
        - endTime
