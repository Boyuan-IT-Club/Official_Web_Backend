          example: 理科大楼 B201
        tableUrl:
          type: string
          description: 使用的飞书多维表格 URL
          example: https://example.feishu.cn/base/xxx?table=yyy
        importedCount:
          type: integer
          description: 该地点成功写入条数
          example: 5
        failedCount:
          type: integer
          description: 该地点失败条数
          example: 0
