spring:
  # 本地运行时自动读取项目根目录 .env；无需手动 source，避免邮件/JWT 等变量遗漏。
  config:
    import: optional:file:.env[.properties]
  application:
    name: Official
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 启动时自动迁移；面试相关表由 Flyway/official.sql 维护（非 JPA 实体，ddl-auto 不会建 interview_schedule）
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    table: flyway_schema_history
  datasource:
    # Docker Compose 将 MySQL 映射到宿主机 3307（见 docker ps）；勿与 3306 上其它 MySQL 实例混淆
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/official?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      # 项目仅使用 RedisTemplate 做缓存/限流，未使用 Spring Data Redis 仓库；
      # 关闭仓库自动装配，避免 redisKeyValueAdapter 依赖 RedisTemplate#getConnectionFactory（测试中被 @MockBean 后为 null）
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # 587/465 加密参数由 MailSenderConfig 按端口自动设置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:root}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2


mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: club.boyuan.official.persistence.entity
  configuration:
    mapUnderscoreToCamelCase: true

booking:
  seckill:
    # 方案B 上线后旧的"自助抢时段"下线：面试改由学生填志愿 + 管理员维护场次 + 算法分配。
    # 保留秒杀基础设施但默认关闭，如需临时回退自助预约可置为 true。
    enabled: false
    user-lock-ttl-seconds: 600
    request-status-ttl-hours: 24

# 应用层网关限流（Redis 滑动窗口），在请求进入 Controller 前拦截
rate-limit:
  enabled: true
  # 按邮箱限流，与下面按 IP 的 rules 构成两个维度：
  # IP 维度放宽到「一个出口打不垮站」即可，邮箱维度收紧到「一个人刷不动」。
  # 这类规则拿不到路径（拦截器跑在读请求体之前），由 Controller 主动调用。
  identity-rules:
    auth-register-email:
      limit: 5
      window-seconds: 3600
    auth-send-email-address:
      # 验证码本身 300 秒过期，同一个邮箱在一个有效期内要 3 封以上就不正常了
      limit: 3
      window-seconds: 300
  rules:
    # 反馈是登录用户就能写的接口，不限流等于给灌库开门。
    # 按用户维度而不是 IP：同一间宿舍/同一个校园 NAT 出口共用 IP，
    # 按 IP 限会误伤一片人
    - name: feedback-create
      pattern: /api/feedback
      method: POST
      limit: 10
      window-seconds: 600
      key-type: USER
    - name: feedback-image
      pattern: /api/feedback/images
      method: POST
      limit: 20
      window-seconds: 600
      key-type: USER
    # 同理：原为 5 次/分钟，同一出口 5 个同学同时点就互相挤掉。
    - name: auth-send-email
      pattern: /api/auth/send-email-code
      method: POST
      limit: 20
      window-seconds: 60
      key-type: IP
    - name: auth-send-sms
      pattern: /api/auth/send-sms-code
      method: POST
      limit: 5
      window-seconds: 60
      key-type: IP
    - name: auth-login
      pattern: /api/auth/login
      method: POST
      limit: 20
      window-seconds: 60
      key-type: IP
    # 2026-09-11：原为 3 次/小时，校园 NAT 下一栋楼共用出口 IP，
    # 一个同学试错两次就把名额用光，室友直接注册不了（线上实际打出 211 次 429）。
    # 放宽到 10 次/小时，真正防刷交给下面的 auth-register-email。
    - name: auth-register
      pattern: /api/auth/register
      method: POST
      limit: 10
      window-seconds: 3600
      key-type: IP
    - name: booking-seckill
      pattern: /api/interview/booking/seckill
      method: POST
      limit: 10
      window-seconds: 60
      key-type: USER
    - name: booking-create
      pattern: /api/interview/booking
      method: POST
      limit: 10
      window-seconds: 60
      key-type: USER
    - name: booking-list-segments
      pattern: /api/interview/booking/cycles/*/segments
      method: GET
      limit: 60
      window-seconds: 60
      key-type: USER
    - name: evaluation-intake
      pattern: /api/public/evaluations
      method: POST
      limit: 300
      window-seconds: 60
      key-type: REMOTE_ADDR

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# 协同评价服务（Hocuspocus）：与本服务共享 JWT 密钥做连接鉴权，
# 回写评价与拉取播种数据则走 /api/internal/**，用下面这把独立的服务令牌。
# 未配置时内部接口一律拒绝，不会退化为匿名可访问。
collab:
  service-token: ${COLLAB_SERVICE_TOKEN:}

# 飞书开放平台（多维表格导入）
feishu:
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  api-base-url: ${FEISHU_API_BASE_URL:https://open.feishu.cn}
  batch-size: ${FEISHU_BATCH_SIZE:100}
  parallel-bucket-concurrency: ${FEISHU_PARALLEL_BUCKET_CONCURRENCY:3}
  list-page-size: ${FEISHU_LIST_PAGE_SIZE:500}
  api-max-retries: ${FEISHU_API_MAX_RETRIES:3}
  api-initial-backoff-ms: ${FEISHU_API_INITIAL_BACKOFF_MS:500}
  api-max-backoff-ms: ${FEISHU_API_MAX_BACKOFF_MS:8000}
  circuit-failure-threshold: ${FEISHU_CIRCUIT_FAILURE_THRESHOLD:5}
  circuit-open-seconds: ${FEISHU_CIRCUIT_OPEN_SECONDS:30}
  task-ttl-days: ${FEISHU_TASK_TTL_DAYS:7}
  task-lock-ttl-hours: ${FEISHU_TASK_LOCK_TTL_HOURS:24}

# 面试邮件通知（预约成功、定时提醒、录取/未录取）
outbox:
  enabled: false
  relay-interval-ms: 1000
  batch-size: 50
  max-retries: 8

interview:
  notification:
    enabled: true
    eve-reminder-cron: "0 0 12 * * ?"

server:
  port: 8080

# 短信服务配置
sms:
  access-key: ${SMS_ACCESS_KEY:}
  secret-key: ${SMS_SECRET_KEY:}

# 腾讯云 COS 对象存储（头像上传）
cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:ap-shanghai}
  bucket: ${COS_BUCKET:}
  public-base-url: ${COS_PUBLIC_BASE_URL:}
  avatar-prefix: ${COS_AVATAR_PREFIX:avatars/}

# 客服 Agent 服务(INF-04;M6 #115 管理代理转发目标,路径含 /api/agent 前缀)
agent:
  base-url: ${AGENT_BASE_URL:http://127.0.0.1:8001/api/agent}
