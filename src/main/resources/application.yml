spring:
  application:
    name: Official
  datasource:
    url: jdbc:mysql://localhost:3306/official?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # 移除数据库方言配置，让Hibernate自动检测
    # database-platform: org.hibernate.dialect.MySQLDialect
    # 明确关闭open-in-view以消除警告
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # 587/465 加密参数由 MailSenderConfig 按端口自动设置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:root}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2


mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: club.boyuan.official.entity
  configuration:
    mapUnderscoreToCamelCase: true

booking:
  seckill:
    enabled: true
    user-lock-ttl-seconds: 600
    request-status-ttl-hours: 24

# 应用层网关限流（Redis 滑动窗口），在请求进入 Controller 前拦截
rate-limit:
  enabled: true
  rules:
    - name: auth-send-email
      pattern: /api/auth/send-email-code
      method: POST
      limit: 5
      window-seconds: 60
      key-type: IP
    - name: auth-send-sms
      pattern: /api/auth/send-sms-code
      method: POST
      limit: 5
      window-seconds: 60
      key-type: IP
    - name: auth-login
      pattern: /api/auth/login
      method: POST
      limit: 20
      window-seconds: 60
      key-type: IP
    - name: auth-register
      pattern: /api/auth/register
      method: POST
      limit: 3
      window-seconds: 3600
      key-type: IP
    - name: booking-seckill
      pattern: /api/interview/booking/seckill
      method: POST
      limit: 10
      window-seconds: 60
      key-type: USER
    - name: booking-create
      pattern: /api/interview/booking
      method: POST
      limit: 10
      window-seconds: 60
      key-type: USER
    - name: booking-list-segments
      pattern: /api/interview/booking/cycles/*/segments
      method: GET
      limit: 60
      window-seconds: 60
      key-type: USER

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# 飞书开放平台（多维表格导入）
feishu:
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  api-base-url: ${FEISHU_API_BASE_URL:https://open.feishu.cn}
  batch-size: ${FEISHU_BATCH_SIZE:100}

# 面试邮件通知（预约成功、定时提醒、录取/未录取）
interview:
  notification:
    enabled: true
    eve-reminder-cron: "0 0 12 * * ?"
    day-reminder-cron: "0 0 8 * * ?"

server:
  port: 8080

# 短信服务配置
sms:
  access-key: ${SMS_ACCESS_KEY:}
  secret-key: ${SMS_SECRET_KEY:}