spring:
  application:
    name: Official
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    table: flyway_schema_history
  datasource:
    url: jdbc:mysql://mysql:${MYSQL_PORT}/${DB_NAME}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  data:
    redis:
      host: redis
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
  servlet:
    multipart:
      file-size-threshold: 10MB
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# 只暴露巡检需要的两个端点：health 供 nginx 与负载均衡探活，
# prometheus 供节点巡检脚本采集 JVM 堆、GC 与 HikariCP 连接池指标。
# 8080 未对公网开放（由云安全组拦截），指标仅在内网可达；
# 其余 actuator 端点保持关闭，避免泄露配置与环境变量。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: official

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: club.boyuan.official.persistence.entity
  configuration:
    mapUnderscoreToCamelCase: true

outbox:
  enabled: ${OUTBOX_ENABLED:true}
  relay-interval-ms: 1000
  batch-size: 50
  max-retries: 8

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

sms:
  access-key: ${SMS_ACCESS_KEY:your-sms-access-key}
  secret-key: ${SMS_SECRET_KEY:your-sms-secret-key}
  template-id:
    verification-code: ${SMS_TEMPLATE_ID_VERIFICATION:your-sms-template-id}
  region-id: ${SMS_REGION_ID:your-sms-region-id}
  verification-code:
    length: 6
    expiration-minutes: 5

cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:ap-shanghai}
  bucket: ${COS_BUCKET:}
  public-base-url: ${COS_PUBLIC_BASE_URL:}
  avatar-prefix: ${COS_AVATAR_PREFIX:avatars/}