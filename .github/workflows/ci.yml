name: CI

# PR 与非 main 分支推送时跑测试 + 覆盖率，作为质量门禁。
# @SpringBootTest 会启动完整容器（Flyway 迁移 + Redis + RabbitMQ），
# 因此为 CI 挂上 MySQL/Redis/RabbitMQ 服务容器，全新空库由 Flyway 从零迁移。
on:
  pull_request:
  push:
    branches-ignore:
      - main   # main 的构建+测试+部署由 docker-push.yml 负责

jobs:
  test:
    name: Build & Test & Coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: official
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: root
          RABBITMQ_DEFAULT_PASS: root
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s --health-timeout=10s --health-retries=15

    env:
      # 指向上面的服务容器（datasource url 用 localhost:${MYSQL_PORT}/official）
      MYSQL_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: root
      RABBITMQ_PASSWORD: root
      # 仅供测试上下文启动用，非真实密钥（HS256 需足够长度）
      JWT_SECRET: ci-only-test-secret-not-for-production-0123456789abcdef0123456789

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Flyway 见到同一版本号两个脚本会直接启动失败（"Found more than one migration with
      # version N"），而这在并行开发里很容易发生——两个分支各自认为下一个版本号是 N。
      # 真出现时是整个应用起不来，所以放在跑测试之前用几行 shell 挡掉，反馈比等 Spring
      # 上下文初始化失败快得多，报错也直白。
      - name: Check migration versions are unique
        run: |
          dup=$(ls src/main/resources/db/migration/ | grep -oE '^V[0-9]+' | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::迁移版本号重复：$dup"
            ls src/main/resources/db/migration/ | grep -E "^($(echo "$dup" | paste -sd'|' -))__"
            echo "改用一个未被占用的版本号；新增前先看生产 flyway_schema_history 的最大版本"
            exit 1
          fi
          echo "迁移版本号唯一：$(ls src/main/resources/db/migration/ | wc -l | tr -d ' ') 个脚本"

      - name: Run tests (with JaCoCo)
        run: |
          chmod +x mvnw
          ./mvnw -B clean test

      - name: Coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "未生成覆盖率报告（可能测试未跑到 report 阶段）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F',' 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7} END {
            inst=im+ic; brc=bm+bc;
            ip = (inst>0)? 100*ic/inst : 0;
            bp = (brc>0)? 100*bc/brc : 0;
            printf("## 测试覆盖率 (JaCoCo)\n\n| 维度 | 覆盖 | 总计 | 覆盖率 |\n|---|---|---|---|\n");
            printf("| 指令(Instruction) | %d | %d | %.1f%% |\n", ic, inst, ip);
            printf("| 分支(Branch) | %d | %d | %.1f%% |\n", bc, brc, bp);
          }' "$CSV" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: ignore

  # Docker 构建冒烟测试：PR 阶段验证 Dockerfile（分层解包/多阶段构建）能成功出镜像，
  # 只构建不推送，避免 Dockerfile 问题合入 main 后才在部署时暴露。
  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
