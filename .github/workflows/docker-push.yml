name: Push to Docker Hub & Deploy on main

# 触发：推送到 main、打 v*.*.* 标签、或手动触发
on:
  push:
    branches:
      - main
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: boyuanclub
  IMAGE_NAME: official-core-api
  DOCKERHUB_EMAIL: notify@boyuan.club

jobs:
  # ── 1) 测试门禁：测试不过不发布 ──────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean test

  # ── 2) 构建并推送镜像到 Docker Hub ──────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests   # 测试已在 test job 跑过

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bump Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == 'tag' ]]; then
            VERSION_TAG=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
          else
            RESPONSE=$(curl -s https://hub.docker.com/v2/repositories/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}/tags)
            LATEST_VERSION=$(echo "$RESPONSE" | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [[ -z "$LATEST_VERSION" ]] || [[ "$LATEST_VERSION" == "null" ]]; then
              LATEST_VERSION="0.0.0"
            fi
            IFS='.' read -ra VERSION_PARTS <<< "$LATEST_VERSION"
            if [ ${#VERSION_PARTS[@]} -eq 3 ]; then
              NEW_VERSION="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.$(( ${VERSION_PARTS[2]} + 1 ))"
            else
              NEW_VERSION="0.0.1"
            fi
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

  # ── 3) 自动部署到双机集群（先 B 后 A，滚动重启）─────────────
  deploy:
    name: Deploy to cluster
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Deploy to Node B (8.159.150.156)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST_B }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/boyuan-official
            docker compose pull official
            docker compose up -d official
            echo "等待 B 健康检查..."
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "Node B UP"; break
              fi
              sleep 5
              if [ "$i" = "20" ]; then echo "Node B 健康检查超时" >&2; exit 1; fi
            done

      - name: Deploy to Node A (8.159.153.140)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST_A }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/boyuan-official
            docker compose pull official
            docker compose up -d official
            echo "等待 A 健康检查..."
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "Node A UP"; break
              fi
              sleep 5
              if [ "$i" = "20" ]; then echo "Node A 健康检查超时" >&2; exit 1; fi
            done

      - name: Verify via load balancer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST_A }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/user/login || true)
            echo "LB /api 返回码: $code (401/400 表示反代通)"
