name: Push to Docker Hub & Deploy on main

# 触发：推送到 main、打 v*.*.* 标签、或手动触发
on:
  push:
    branches:
      - main
    tags: [ 'v*.*.*' ]
    # 纯文档改动不触发构建与生产部署
    paths-ignore:
      - '**.md'
      - 'openapi.yaml'
      - 'docs/**'
  workflow_dispatch:

env:
  DOCKER_USERNAME: boyuanclub
  IMAGE_NAME: official-core-api
  COLLAB_IMAGE_NAME: official-collab-server
  DOCKERHUB_EMAIL: notify@boyuan.club

jobs:
  # ── 1) 测试门禁：测试不过不发布 ──────────────────────────────
  # @SpringBootTest 需完整容器(Flyway+Redis+RabbitMQ)，为测试挂服务容器，与 ci.yml 一致。
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: official
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: root
          RABBITMQ_DEFAULT_PASS: root
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s --health-timeout=10s --health-retries=15
    env:
      MYSQL_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: root
      RABBITMQ_PASSWORD: root
      JWT_SECRET: ci-only-test-secret-not-for-production-0123456789abcdef0123456789
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean test

  # ── 2) 构建并推送镜像到 Docker Hub ──────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests   # 测试已在 test job 跑过

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bump Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == 'tag' ]]; then
            VERSION_TAG=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
          else
            RESPONSE=$(curl -s https://hub.docker.com/v2/repositories/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}/tags)
            LATEST_VERSION=$(echo "$RESPONSE" | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [[ -z "$LATEST_VERSION" ]] || [[ "$LATEST_VERSION" == "null" ]]; then
              LATEST_VERSION="0.0.0"
            fi
            IFS='.' read -ra VERSION_PARTS <<< "$LATEST_VERSION"
            if [ ${#VERSION_PARTS[@]} -eq 3 ]; then
              NEW_VERSION="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.$(( ${VERSION_PARTS[2]} + 1 ))"
            else
              NEW_VERSION="0.0.1"
            fi
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          # provenance 附加清单会让部分旧版拉取端多一次往返，关闭以保持清单精简
          provenance: false
          # GHA 层缓存：基础层/字体层/依赖层在依赖未变时摘要不变，
          # 服务器 docker pull 仅下载变化的应用层（几百 KB），部署从 ~10 分钟降到秒级
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

  # ── 2b) 构建并推送协同服务镜像 ───────────────────────────────
  # 协同服务（Yjs/Hocuspocus）源码在本仓库 collab-server/ 下，与后端同批发布。
  # 它不依赖 Maven 产物，故不必等 build，与之并行即可。
  build-collab:
    name: Build & Push collab server
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push collab image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./collab-server
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=collab
          cache-to: type=gha,mode=max,scope=collab
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.COLLAB_IMAGE_NAME }}:latest

  # ── 3) 双机并行预拉镜像 ─────────────────────────────────────
  # 拉镜像是部署耗时大头（跨境访问 Docker Hub 慢且不稳定），A/B 并行拉、
  # 单次限时 10 分钟：卡死即杀掉重试（已完成的层保留，重试只补缺失层）。
  # 配合分层镜像+构建缓存，依赖未变时通常仅拉几百 KB，秒级完成。
  pull:
    name: Pull image
    runs-on: ubuntu-latest
    needs: [ build, build-collab ]
    if: github.event_name == 'push'
    strategy:
      matrix:
        node: [ B, A ]
    steps:
      - name: Pull image on Node ${{ matrix.node }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets[format('DEPLOY_HOST_{0}', matrix.node)] }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 35m
          script: |
            set -e
            cd ~/boyuan-official
            # 协同服务只部署在 Node A（必须单实例），故仅 A 的 compose 里有 official-collab
            services="official"
            if docker compose config --services | grep -qx official-collab; then
              services="official official-collab"
            fi
            for svc in $services; do
              n=0
              until timeout 600 docker compose pull "$svc"; do
                n=$((n+1))
                if [ "$n" -ge 3 ]; then echo "Node ${{ matrix.node }} 拉取 $svc 重试 3 次仍失败" >&2; exit 1; fi
                echo "拉取 $svc 失败/超时，第 $n 次重试..."; sleep 10
              done
            done
            echo "Node ${{ matrix.node }} 镜像就绪：$services"

  # ── 4) 滚动重启（先 B 后 A，镜像已就绪，仅换容器+健康检查）──
  deploy:
    name: Deploy to cluster
    runs-on: ubuntu-latest
    needs: pull
    if: github.event_name == 'push'
    steps:
      - name: Restart Node B (8.159.150.156)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST_B }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/boyuan-official
            docker compose up -d official
            echo "等待 B 健康检查..."
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "Node B UP"; break
              fi
              sleep 5
              if [ "$i" = "20" ]; then echo "Node B 健康检查超时" >&2; exit 1; fi
            done
            # 清理换代后悬空的旧镜像层，防磁盘占满
            docker image prune -f >/dev/null 2>&1 || true

      - name: Restart Node A (8.159.153.140)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST_A }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/boyuan-official
            docker compose up -d official
            echo "等待 A 健康检查..."
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "Node A UP"; break
              fi
              sleep 5
              if [ "$i" = "20" ]; then echo "Node A 健康检查超时" >&2; exit 1; fi
            done
            # 协同服务随后端一起换代；它只在 A 上跑，重启会断开在线的评价表连接，
            # 前端 provider 会自动重连并从快照恢复，未落库的编辑由 onDisconnect 兜底物化
            if docker compose config --services | grep -qx official-collab; then
              docker compose up -d official-collab
              for i in $(seq 1 12); do
                if curl -fsS -o /dev/null http://127.0.0.1:3100/; then echo "协同服务 UP"; break; fi
                sleep 5
                if [ "$i" = "12" ]; then echo "协同服务健康检查超时" >&2; exit 1; fi
              done
            fi
            docker image prune -f >/dev/null 2>&1 || true

      - name: Verify via load balancer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST_A }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/user/login || true)
            echo "LB /api 返回码: $code (401/400 表示反代通)"
